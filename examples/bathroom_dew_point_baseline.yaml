# Example: the bathroom's own 24 h median dew point (the blueprint's baseline).
#
# A blueprint has no history, so the baseline has to be a separate sensor.
# Create one per bathroom.
#
# EASIEST (tested): Settings > Devices & services > Helpers > Create helper >
# Statistics
#   Entity ............ your bathroom dew point sensor
#   Statistic ......... Arithmetic median
#   Maximum age ....... 24 hours
#   Sampling size ..... 1000
#
# YAML equivalent (configuration.yaml, `sensor:` section). Not tested on every
# Home Assistant version: check the docs of the `statistics` integration if it
# is rejected.
sensor:
  - platform: statistics
    name: "Bathroom dew point baseline"
    unique_id: bathroom_dew_point_baseline
    entity_id: sensor.bathroom_dew_point   # <- your bathroom dew point sensor
    state_characteristic: median
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 1
# Then select sensor.bathroom_dew_point_baseline as the "Bathroom dew point
# baseline" in the blueprint.
