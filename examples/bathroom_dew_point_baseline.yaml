# Example: the bathroom's own 24 h median dew point, used as the reference.
#
# Option 2 of the blueprint (no sensors in other rooms needed). A blueprint has
# no history, so this has to be a separate sensor. Create one per bathroom.
#
# Easiest way: Settings > Devices & services > Helpers > Create helper >
# Statistics (entity = bathroom dew point, statistic = Arithmetic median,
# max age = 24 hours, sampling size = 1000).
#
# The UI helper is the path that has been tested. The YAML below is the
# equivalent for people who prefer it; check the Home Assistant docs for the
# `statistics` integration if your version rejects it.
#
# Or in YAML (configuration.yaml, `sensor:` section):
sensor:
  - platform: statistics
    name: "Bathroom dew point baseline"
    unique_id: bathroom_dew_point_baseline
    entity_id: sensor.bathroom_dew_point   # <- your bathroom dew point sensor
    state_characteristic: median
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 1
# Then select sensor.bathroom_dew_point_baseline as the "Reference dew point
# sensor" in the blueprint.
